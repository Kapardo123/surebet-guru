<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#2b3473"/>
      <stop offset=".55" stop-color="#141a3c"/>
      <stop offset="1" stop-color="#070918"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6416"/>
      <stop offset=".22" stop-color="#f6dc8a"/>
      <stop offset=".42" stop-color="#b98a2a"/>
      <stop offset=".58" stop-color="#fff1b8"/>
      <stop offset=".76" stop-color="#a8781f"/>
      <stop offset="1" stop-color="#f2cf6a"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".45" stop-color="#e2b54c"/>
      <stop offset="1" stop-color="#fbe7a0"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fbf74"/>
      <stop offset="1" stop-color="#1c7a45"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3db06e"/>
      <stop offset="1" stop-color="#145c35"/>
    </linearGradient>
    <pattern id="lattice" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#18204c"/>
      <path d="M0 0H16M0 0V16" stroke="#e7c35e" stroke-opacity=".22" stroke-width="2.4"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frontClip">
      <rect x="180" y="104" width="210" height="300" rx="28"/>
    </clipPath>
  </defs>

  <!-- Felt -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="262" cy="430" rx="170" ry="30" fill="#000" opacity=".45" filter="url(#soft)"/>
  <circle cx="256" cy="210" r="190" fill="#e7c35e" opacity=".07" filter="url(#soft)"/>

  <!-- Back card: Common, green frame, pitch art -->
  <g transform="rotate(-14 230 280)" filter="url(#shadow)">
    <rect x="122" y="124" width="198" height="278" rx="26" fill="url(#green)"/>
    <rect x="133" y="135" width="176" height="256" rx="18" fill="#f3efe4"/>
    <rect x="146" y="150" width="150" height="96" rx="10" fill="url(#pitch)"/>
    <rect x="158" y="160" width="126" height="76" rx="2" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <line x1="221" y1="160" x2="221" y2="236" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <circle cx="221" cy="198" r="14" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <rect x="152" y="258" width="138" height="16" rx="3" fill="#1b2140"/>
    <rect x="152" y="284" width="96" height="10" rx="5" fill="#151a2e" opacity=".25"/>
    <rect x="152" y="304" width="138" height="44" rx="8" fill="#2c9a5c" opacity=".14"/>
  </g>

  <!-- Front card: Gold foil, lattice back, G medallion -->
  <g transform="rotate(9 285 254)" filter="url(#shadow)">
    <rect x="180" y="104" width="210" height="300" rx="28" fill="url(#gold)"/>
    <rect x="193" y="117" width="184" height="274" rx="18" fill="url(#lattice)"/>
    <rect x="193" y="117" width="184" height="274" rx="18" fill="none" stroke="#f6dc8a" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="285" cy="254" r="70" fill="url(#gold)"/>
    <circle cx="285" cy="254" r="58" fill="#10163a"/>
    <!-- Monogram G drawn as geometry (font-independent) -->
    <path d="M 316.1 222.9 A 44 44 0 1 0 323.1 276 L 323.1 258 L 293 258"
          fill="none" stroke="url(#goldStroke)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <g clip-path="url(#frontClip)">
      <rect x="120" y="60" width="70" height="420" fill="url(#shine)" transform="rotate(24 285 254)"/>
    </g>
  </g>

  <!-- Sparkle -->
  <path d="M404 92 l9 29 29 9 -29 9 -9 29 -9 -29 -29 -9 29 -9z" fill="#fff6d6"/>
  <path d="M120 404 l5 16 16 5 -16 5 -5 16 -5 -16 -16 -5 16 -5z" fill="#fff6d6" opacity=".7"/>
</svg>
