<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO: replace YOUR-DOMAIN.TLD everywhere below after choosing the domain -->
    <title>Daily Betting Tips, Predictions &amp; Accumulators | Great Sport Bets</title>
    <meta name="description" content="Daily betting tips with full analysis: single picks, football predictions and accumulators with live odds. Premium unlocks every prediction.">
    <link rel="canonical" href="https://YOUR-DOMAIN.TLD/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Great Sport Bets" />
    <meta name="google-site-verification" content="14aT3uopkFrZb3U0V6dpxwGizLIwlGRuFcuYiwCSFUY" />

    <!-- Tab / home-screen icons (generated from the brand emblem) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0015" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Twitter (absolute URLs — used for shares, affect click-through) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="Great Sport Bets" />
    <meta property="og:title" content="Daily Betting Tips, Predictions &amp; Accumulators | Great Sport Bets">
    <meta property="og:description" content="Daily betting tips with full analysis: single picks, football predictions and accumulators with live odds.">
    <meta property="og:url" content="https://YOUR-DOMAIN.TLD/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.TLD/og-image.png">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Great Sport Bets — daily betting tips and predictions">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daily Betting Tips, Predictions &amp; Accumulators | Great Sport Bets">
    <meta name="twitter:description" content="Daily betting tips with full analysis: single picks, football predictions and accumulators with live odds.">
    <meta name="twitter:image" content="https://YOUR-DOMAIN.TLD/og-image.png">

    <!-- Fonts: CSS @import is render-blocking; preconnect cuts ~100-200ms off first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Warm TLS/DNS to the logo CDNs before the first tip renders -->
    <link rel="preconnect" href="https://tmssl.akamaized.net" crossorigin />
    <link rel="preconnect" href="https://images.fotmob.com" />
    <link rel="preconnect" href="https://cdn.soccerwiki.org" />
    <link rel="preconnect" href="https://imagecache.365scores.com" />
    <link rel="dns-prefetch" href="https://www.transfermarkt.com" />
    <link rel="dns-prefetch" href="https://apigw.fotmob.com" />
  </head>

  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to use Great Sport Bets.</noscript>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
